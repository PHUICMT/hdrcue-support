<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HDRcue demo</title>
  <meta name="robots" content="noindex">
  <script src="../language.js?v=2"></script>
  <link rel="icon" href="../images/icon.png">
  <link rel="stylesheet" href="../fonts.css?v=1">
  <link rel="stylesheet" href="demo.css?v=18">
</head>
<body>
  <!-- The window is drawn for sighted visitors; the list below reads out the same steps. -->
  <ol class="sr-only" id="steps"></ol>

  <div class="frame" id="frame">
    <div class="stage" id="stage" aria-hidden="true">
      <div class="scene" id="scene">
        <div class="app-window" id="app-window"></div>
        <div class="pointer" id="pointer">
          <svg viewBox="0 0 17 25"><path d="M1 1v19.6l4.6-4.4 3.1 7.2 3.2-1.4-3-7h6.4z" fill="#ffffff" stroke="#000000" stroke-width="1.1" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>
    <p class="bubble" id="bubble" aria-hidden="true"><span class="bubble-number"></span><span class="bubble-text"></span></p>
  </div>

  <!-- view.js asks for demo.css with its own ?v=, so keep the two numbers the same. -->
  <script src="view.js?v=18"></script>
  <script src="demo.js?v=15"></script>
</body>
</html>
