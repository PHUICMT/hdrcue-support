name: Suggest an idea
description: Something SceneShift could do, or do better.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing. English or Thai are both fine.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like SceneShift to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: What are you trying to do, and what gets in the way today?
