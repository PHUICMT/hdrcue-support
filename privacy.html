    <h2 data-i18n="privacy.reads.title"></h2>

    <!-- The English text without JavaScript, for readers and checkers that do not run it. -->
    <noscript>
      <p>SceneShift works entirely on your PC. It reads which apps are running, the state of
      your displays and the apps in your Start menu. It stores your settings in its own
      folder on your PC. It sends nothing: no internet connection, no telemetry.</p>
    </noscript>
