    <!-- The English text without JavaScript, for readers and checkers that do not run it. -->
    <noscript>
      <p>HDRcue works entirely on your PC. It reads which apps are running, the state of
      your displays and the apps in your Start menu. For HDR by file it reads which video
      your player is playing, through connections that stay on your PC, and for PotPlayer it
      reads the start of that file. It changes a player's settings file only after you agree,
      and for VLC that turns on its web interface for this PC only, with a random password.
      It stores your settings in its own folder on your PC, plus one value in the Windows
      registry for your user account with a second copy of the Pro trial dates. A third copy
      of the trial dates stays in a small file under AppData\LocalLow\HDRcue after you
      uninstall, so that installing again does not start the trial over. Backups are off until
      you turn them on. Then each PC writes its own file, named after the PC, to the folder you
      choose. It has no telemetry and no account. Its only connection beyond your PC is to the
      Microsoft Store, to check and buy HDRcue Pro.</p>
