    <!-- The English text without JavaScript, for readers and checkers that do not run it. -->
    <noscript>
      <p>HDRcue works entirely on your PC. It reads which apps are running, the state of
      your displays and the apps in your Start menu. It stores your settings in its own
      folder on your PC, plus one value in the Windows registry for your user account with a
      second copy of the Pro trial dates. A third copy of the trial dates stays in a small file
      under AppData\LocalLow\HDRcue after you uninstall, so that installing again does not
      start the trial over. It has no telemetry and no account. Its only connection is to the
      Microsoft Store, to check and buy HDRcue Pro.</p>
